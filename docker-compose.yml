services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aeris-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WIND_APP_NAME=Wind Forecast Intelligence API
      - WIND_ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - WIND_DAY_AHEAD_CUTOFF_HOUR=10
      - WIND_REQUEST_TIMEOUT_SECONDS=30.0
      - WIND_ENABLE_SNAPSHOT_FALLBACK=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - aeris-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeris-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aeris-network

networks:
  aeris-network:
    driver: bridge
